name: lakoli_mobile
description: Application mobile officielle de Lakoli — réseau social des écoles de Guinée.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # État
  flutter_riverpod: ^2.6.1

  # Réseau
  dio: ^5.7.0

  # Stockage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Navigation
  go_router: ^14.6.2

  # Temps réel — Reverb parle le protocole Pusher, donc c'est le client compatible
  # côté Flutter (le web utilise laravel-echo + pusher-js pour la même raison).
  pusher_channels_flutter: ^2.4.0

  # Médias
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  image_picker: ^1.1.2
  video_compress: ^3.1.3

  # Utilitaires
  intl: ^0.19.0
  equatable: ^2.0.7
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 500
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 600
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 700
